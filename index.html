### The "Frozen" Connection Glitch
Yes, the issue you're experiencing is almost certainly because you are running both the host and the client on the same computer. This is commonly known as a **Window Focus** issue. 

*   **What is happening:** Most game engines automatically pause or heavily throttle the game when a window is not actively clicked on (running in the background) to save CPU power. This is why nothing loads or moves until you click back into that specific screen.
*   **The Fix:** You need to go into your game engine's project settings and enable a setting usually called **"Run in Background"** or **"Allow Background Execution."** This will force both the host and client windows to keep updating simultaneously.

### Setting Up Servers (Public vs. Private)
To add a "Public Play" and "Private Play" button, you will need to implement **Matchmaking** using a networking service (like Photon, Unity Relay, or Epic Online Services).

*   **Private Games:** Use your networking service to generate a unique lobby code when the host creates a room. The client will input this string of text to connect directly to that specific lobby.
*   **Public Games:** You will need to set up a "Server Browser" or quick-match feature. When a player hosts a public game, the game registers it to a central list. When someone clicks "Public Play," the system automatically connects them to a random open lobby from that list.
