<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pol.io</title>
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
    canvas { border: 2px solid #333; background: #222; cursor: crosshair; display: block; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #menu-container { pointer-events: auto; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); text-align: center; background: rgba(15, 15, 20, 0.9); padding: 15px 25px; border-radius: 8px; z-index: 10; border: 1px solid #444; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: opacity 0.2s; }
    
    input, button { padding: 8px 12px; font-size: 14px; margin: 2px; cursor: pointer; border-radius: 4px; border: 1px solid #666; background: #333; color: white; transition: 0.2s; }
    button:hover { background: #555; border-color: #00ffcc; }
    #scores { margin-top: 10px; font-weight: bold; color: #ffcc00; font-size: 14px; }
    p { margin: 5px 0 0 0; font-size: 13px; color: #ccc; }

    #hud { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); text-align: center; width: 450px; background: rgba(10, 10, 15, 0.85); padding: 12px; border-radius: 12px; border: 1px solid #444; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: opacity 0.2s; }
    #xp-bar-bg { width: 100%; height: 18px; background: #222; border-radius: 9px; overflow: hidden; margin-top: 8px; border: 1px solid #111; }
    #xp-bar-fill { height: 100%; background: linear-gradient(90deg, #ff9900, #ffcc00); width: 0%; transition: width 0.3s ease-out; }
    #level-txt { font-weight: bold; font-size: 18px; margin: 0; color: #fff; text-shadow: 1px 1px 2px #000; }

    #upgrade-menu { 
      pointer-events: auto; position: absolute; 
      top: 15px; left: 15px; 
      background: rgba(15, 15, 25, 0.95); padding: 20px; 
      border-radius: 10px; border: 2px solid #555; 
      display: none; text-align: left; 
      box-shadow: 0 5px 20px rgba(0,0,0,0.8); transition: opacity 0.2s;
    }
    #upg-title { margin: 0 0 10px 0; font-size: 18px; color: #00ffcc; text-shadow: 1px 1px 3px black; }
    .upg-btn { display: block; width: 220px; margin: 8px 0; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid rgba(0,0,0,0.5); border-radius: 6px; color: white; text-shadow: 1px 1px 2px black; cursor: pointer; text-align: center; transition: 0.1s;}
    .upg-btn:hover { filter: brightness(1.2); transform: scale(1.02); }

    /* Leaderboard – bottom-right */
    #leaderboard {
      pointer-events: auto;
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #444;
      min-width: 150px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      font-size: 13px;
      color: #ccc;
      z-index: 20;
    }
    #leaderboard h3 { margin: 0 0 6px 0; color: #ffcc00; text-align: center; font-size: 15px; border-bottom: 1px solid #444; padding-bottom: 3px; }
    #leaderboard .entry { display: flex; justify-content: space-between; padding: 2px 0; }
    #leaderboard .entry .name { color: #fff; }
    #leaderboard .entry .score { color: #ffaa00; font-weight: bold; }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div id="menu-container">
      <div id="menu">
        <h2 style="margin: 0 0 10px 0; color: #00ffcc; font-size: 24px; text-shadow: 0 0 10px rgba(0,255,204,0.4);">pol.io</h2>
        <button id="host-btn">Host Private Game</button>
        <span style="margin: 0 8px;">OR</span>
        <input type="text" id="join-id" placeholder="5-Letter Code" maxlength="5" style="text-transform:uppercase; width: 110px;" />
        <button id="join-btn">Join Game</button>
      </div>
      <p id="status">Status: Waiting...</p>
      <p style="font-size: 11px; color: #888;">Hold [Y] to view the Class Tree</p>
      <div id="scores"></div>
    </div>

    <div id="upgrade-menu">
      <h2 id="upg-title">Upgrade Available!</h2>
      <p style="margin-bottom: 15px;">Choose your path:</p>
      <div id="upgrade-buttons"></div>
    </div>

    <div id="hud">
      <p id="level-txt">Level 1 - Squire</p>
      <div id="xp-bar-bg"><div id="xp-bar-fill"></div></div>
    </div>

    <div id="leaderboard">
      <h3>🏆 Leaderboard</h3>
      <div id="lb-entries"></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="1000" height="700"></canvas>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

    const WORLD_SIZE = 2000;
    
    // BALANCED CLASS DICTIONARY (including level 45 final tier)
    const CLASSES = {
      // TIER 1
      "Squire":     { color: "#3366ff", size: 30, speed: 5.2, dash: 15, swingTicks: 14, cooldown: 55, w: 10, l: 30 },
      
      // TIER 2 (level 5)
      "Guardian":   { color: "#00cc00", size: 32, speed: 4.2, dash: 11, swingTicks: 18, cooldown: 55, w: 42, l: 14 }, 
      "Duelist":    { color: "#00ffff", size: 28, speed: 6.5, dash: 19, swingTicks: 10, cooldown: 40, w: 8,  l: 48 },
      "Berserker":  { color: "#ff0000", size: 30, speed: 4.5, dash: 14, swingTicks: 20, cooldown: 70, w: 22, l: 40 },
      "Warden":     { color: "#ffff00", size: 30, speed: 5.4, dash: 15, swingTicks: 14, cooldown: 55, w: 10, l: 28, trapRate: 350 }, 
      
      // TIER 3 (level 15)
      "Juggernaut": { color: "#005500", size: 40, speed: 3.4, dash: 9,  swingTicks: 25, cooldown: 55, w: 55, l: 18 },
      "Reflector":  { color: "#88ff88", size: 30, speed: 4.8, dash: 12, swingTicks: 14, cooldown: 50, w: 38, l: 12 },
      "Hurricane":  { color: "#99ccff", size: 28, speed: 7.2, dash: 20, swingTicks: 18, cooldown: 40, w: 8,  l: 36, spins: true },
      "Spearman":   { color: "#008888", size: 30, speed: 5.8, dash: 16, swingTicks: 14, cooldown: 45, w: 6,  l: 70 },
      "Executioner":{ color: "#880000", size: 32, speed: 3.8, dash: 12, swingTicks: 25, cooldown: 80, w: 44, l: 38 }, 
      "Flailer":    { color: "#ff8800", size: 30, speed: 4.8, dash: 14, swingTicks: 18, cooldown: 60, w: 18, l: 48, spins: true }, 
      "Minefield":  { color: "#ffcc00", size: 30, speed: 5.4, dash: 15, swingTicks: 14, cooldown: 55, w: 10, l: 28, trapRate: 160 },
      "Gunblade":   { color: "#aa00ff", size: 30, speed: 5.4, dash: 15, swingTicks: 18, cooldown: 55, w: 10, l: 22, shoots: true },
      
      // TIER 4 (level 30)
      "Behemoth":   { color: "#002200", size: 50, speed: 2.8, dash: 7,  swingTicks: 30, cooldown: 70, w: 75, l: 25 },
      "Fortress":   { color: "#335533", size: 42, speed: 3.2, dash: 8,  swingTicks: 18, cooldown: 45, w: 80, l: 16 },
      "Mirror":     { color: "#ccffcc", size: 30, speed: 4.8, dash: 12, swingTicks: 14, cooldown: 45, w: 42, l: 12, spins: true },
      "Deflector":  { color: "#aaffaa", size: 34, speed: 4.2, dash: 12, swingTicks: 14, cooldown: 40, w: 55, l: 15 },
      "Typhoon":    { color: "#e6f2ff", size: 30, speed: 7.8, dash: 22, swingTicks: 20, cooldown: 35, w: 10, l: 44, spins: true },
      "Cyclone":    { color: "#3399ff", size: 26, speed: 8.5, dash: 24, swingTicks: 14, cooldown: 30, w: 6,  l: 30, spins: true },
      "Lancer":     { color: "#004444", size: 30, speed: 6.2, dash: 20, swingTicks: 12, cooldown: 40, w: 5,  l: 85 },
      "Pikeman":    { color: "#00cccc", size: 34, speed: 5.2, dash: 14, swingTicks: 18, cooldown: 45, w: 12, l: 70 },
      "Guillotine": { color: "#440000", size: 34, speed: 3.5, dash: 10, swingTicks: 30, cooldown: 90, w: 60, l: 45 },
      "Reaper":     { color: "#cc0000", size: 30, speed: 5.2, dash: 16, swingTicks: 14, cooldown: 55, w: 36, l: 48 },
      "WreckingBall":{ color: "#cc6600", size: 38, speed: 3.8, dash: 11, swingTicks: 24, cooldown: 70, w: 30, l: 60, spins: true },
      "Meteor":     { color: "#ffaa00", size: 28, speed: 5.8, dash: 16, swingTicks: 12, cooldown: 45, w: 14, l: 42, spins: true },
      "Trapper":    { color: "#ffff66", size: 32, speed: 4.8, dash: 13, swingTicks: 14, cooldown: 55, w: 12, l: 28, trapRate: 90 },
      "Spike":      { color: "#ccaa00", size: 30, speed: 6.0, dash: 18, swingTicks: 14, cooldown: 50, w: 10, l: 22, trapRate: 120 },
      "Artillery":  { color: "#660099", size: 38, speed: 3.8, dash: 11, swingTicks: 30, cooldown: 55, w: 14, l: 28, shoots: true },
      "Sniper":     { color: "#dd88ff", size: 26, speed: 6.2, dash: 20, swingTicks: 12, cooldown: 35, w: 6,  l: 35, shoots: true },

      // TIER 5 (level 45) - Final Evolutions
      "TitanWall":  { color: "#113311", size: 55, speed: 2.2, dash: 5,  swingTicks: 35, cooldown: 80, w: 90, l: 30 },
      "Crusher":    { color: "#225522", size: 50, speed: 2.8, dash: 7,  swingTicks: 28, cooldown: 60, w: 70, l: 35 },
      "ParryKnight":{ color: "#88dd88", size: 32, speed: 4.5, dash: 11, swingTicks: 15, cooldown: 45, w: 45, l: 16 },
      "MirrorMaze": { color: "#aaffaa", size: 36, speed: 4.0, dash: 10, swingTicks: 16, cooldown: 50, w: 60, l: 18, spins: true },
      "Gale":       { color: "#b3d9ff", size: 30, speed: 8.2, dash: 24, swingTicks: 18, cooldown: 32, w: 10, l: 48, spins: true },
      "TwinStorm":  { color: "#66b3ff", size: 28, speed: 8.8, dash: 26, swingTicks: 14, cooldown: 28, w: 8,  l: 38, spins: true },
      "LanceKing":  { color: "#004466", size: 32, speed: 5.8, dash: 18, swingTicks: 13, cooldown: 38, w: 6,  l: 100 },
      "RapidPierce":{ color: "#00aaaa", size: 28, speed: 6.5, dash: 22, swingTicks: 10, cooldown: 35, w: 5,  l: 90 },
      "GiantSlayer":{ color: "#660000", size: 38, speed: 3.2, dash: 9,  swingTicks: 32, cooldown: 85, w: 70, l: 50 },
      "ReaperLord": { color: "#cc4444", size: 32, speed: 4.8, dash: 14, swingTicks: 16, cooldown: 50, w: 42, l: 55 },
      "MeteorWhip": { color: "#cc7700", size: 34, speed: 4.2, dash: 12, swingTicks: 20, cooldown: 65, w: 22, l: 55, spins: true },
      "ChainStorm": { color: "#ffaa33", size: 30, speed: 5.0, dash: 15, swingTicks: 16, cooldown: 55, w: 20, l: 50, spins: true },
      "Landlord":   { color: "#ffdd44", size: 34, speed: 4.5, dash: 13, swingTicks: 14, cooldown: 55, w: 12, l: 28, trapRate: 60 },
      "Spikewall":  { color: "#ccaa22", size: 32, speed: 5.2, dash: 16, swingTicks: 14, cooldown: 50, w: 10, l: 22, trapRate: 80 },
      "Paladin":    { color: "#aa88ff", size: 32, speed: 5.0, dash: 14, swingTicks: 16, cooldown: 50, w: 14, l: 28, shoots: true },
      "Warzone":    { color: "#cc66ff", size: 34, speed: 4.6, dash: 13, swingTicks: 18, cooldown: 55, w: 16, l: 30, shoots: true }
    };

    // Upgrade paths
    const UPGRADE_PATHS = {
      5: { "Squire": ["Guardian", "Duelist", "Berserker", "Warden"] },
      15: {
        "Guardian": ["Juggernaut", "Reflector"],
        "Duelist": ["Hurricane", "Spearman"],
        "Berserker": ["Executioner", "Flailer"],
        "Warden": ["Minefield", "Gunblade"]
      },
      30: {
        "Juggernaut": ["Behemoth", "Fortress"],
        "Reflector": ["Mirror", "Deflector"],
        "Hurricane": ["Typhoon", "Cyclone"],
        "Spearman": ["Lancer", "Pikeman"],
        "Executioner": ["Guillotine", "Reaper"],
        "Flailer": ["WreckingBall", "Meteor"],
        "Minefield": ["Trapper", "Spike"],
        "Gunblade": ["Artillery", "Sniper"]
      },
      45: {
        "Juggernaut": ["TitanWall", "Crusher"],
        "Behemoth": ["TitanWall", "Crusher"],
        "Fortress": ["TitanWall", "Crusher"],
        "Reflector": ["ParryKnight", "MirrorMaze"],
        "Mirror": ["ParryKnight", "MirrorMaze"],
        "Deflector": ["ParryKnight", "MirrorMaze"],
        "Hurricane": ["Gale", "TwinStorm"],
        "Typhoon": ["Gale", "TwinStorm"],
        "Cyclone": ["Gale", "TwinStorm"],
        "Spearman": ["LanceKing", "RapidPierce"],
        "Lancer": ["LanceKing", "RapidPierce"],
        "Pikeman": ["LanceKing", "RapidPierce"],
        "Executioner": ["GiantSlayer", "ReaperLord"],
        "Guillotine": ["GiantSlayer", "ReaperLord"],
        "Reaper": ["GiantSlayer", "ReaperLord"],
        "Flailer": ["MeteorWhip", "ChainStorm"],
        "WreckingBall": ["MeteorWhip", "ChainStorm"],
        "Meteor": ["MeteorWhip", "ChainStorm"],
        "Minefield": ["Landlord", "Spikewall"],
        "Trapper": ["Landlord", "Spikewall"],
        "Spike": ["Landlord", "Spikewall"],
        "Gunblade": ["Paladin", "Warzone"],
        "Artillery": ["Paladin", "Warzone"],
        "Sniper": ["Paladin", "Warzone"]
      }
    };

    let peer = new Peer(Math.random().toString(36).substring(2, 7).toUpperCase(), { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });
    let isHost = false, hostConn = null, clientConns = [], myPlayerId = 0; 
    let gameState = { players: {}, particles: [], orbs: [], traps: [], bullets: [] };
    let lastNetTime = 0, lastClientTime = 0; 
    const keys = {}; let isAttacking = false, mouseX = 0, mouseY = 0, showTree = false;
    let aimDir = { x: 0, y: 0 };

    window.addEventListener("keydown", (e) => { keys[e.code] = true; if (e.key.toLowerCase() === 'y') showTree = true; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; if (e.key.toLowerCase() === 'y') showTree = false; });
    canvas.addEventListener("mousedown", () => isAttacking = true);
    canvas.addEventListener("mouseup", () => isAttacking = false);
    canvas.addEventListener("mousemove", (e) => { mouseX = e.clientX; mouseY = e.clientY; });

    function getAimDir() {
      let myP = gameState.players[myPlayerId];
      if (!myP) return { x: 0, y: -1 };
      let stats = CLASSES[myP.className];
      let size = stats.size;
      let worldX = mouseX + (myP.x - canvas.width/2 + size/2);
      let worldY = mouseY + (myP.y - canvas.height/2 + size/2);
      let dx = worldX - (myP.x + size/2);
      let dy = worldY - (myP.y + size/2);
      let len = Math.hypot(dx, dy);
      if (len < 0.001) return { x: 0, y: -1 };
      return { x: dx/len, y: dy/len };
    }

    function getCardinalDir(aim) {
      let ax = aim.x, ay = aim.y;
      if (Math.abs(ax) > Math.abs(ay)) return ax > 0 ? "right" : "left";
      else return ay > 0 ? "down" : "up";
    }

    function updateHUD() {
      let p = gameState.players[myPlayerId];
      if (!p) return;
      document.getElementById("hud").style.display = "block";
      document.getElementById("level-txt").innerText = `Level ${p.level} - ${p.className}`;
      // XP bar: progress = current XP / required XP (required = level * 1)
      let progress = (p.xp / (p.level * 1)) * 100;
      document.getElementById("xp-bar-fill").style.width = Math.min(100, Math.max(0, progress)) + "%";

      let menu = document.getElementById("upgrade-menu");
      let btns = document.getElementById("upgrade-buttons");
      let options = [];

      if (p.level >= 5 && UPGRADE_PATHS[5][p.className]) options = UPGRADE_PATHS[5][p.className];
      else if (p.level >= 15 && UPGRADE_PATHS[15][p.className]) options = UPGRADE_PATHS[15][p.className];
      else if (p.level >= 30 && UPGRADE_PATHS[30][p.className]) options = UPGRADE_PATHS[30][p.className];
      else if (p.level >= 45 && UPGRADE_PATHS[45][p.className]) options = UPGRADE_PATHS[45][p.className];

      if (options && options.length > 0) {
        if (menu.style.display !== "block") {
          btns.innerHTML = "";
          options.forEach(opt => {
            let b = document.createElement("button");
            b.className = "upg-btn"; b.innerText = opt; b.style.background = CLASSES[opt].color;
            b.onclick = () => selectUpgrade(opt);
            btns.appendChild(b);
          });
          menu.style.display = "block";
        }
      } else { menu.style.display = "none"; }

      updateLeaderboard();
    }

    function selectUpgrade(newClass) {
      document.getElementById("upgrade-menu").style.display = "none";
      if (isHost) gameState.players[myPlayerId].className = newClass;
      else hostConn.send({ type: "upgrade", newClass: newClass });
    }

    document.getElementById("host-btn").onclick = () => {
      isHost = true; document.getElementById("menu").style.display = "none";
      document.getElementById("status").innerText = "HOST CODE: " + peer.id;
      addPlayer(0); myPlayerId = 0;
      peer.on("connection", (conn) => {
        if (clientConns.length >= 3) return conn.close();
        let newId = clientConns.length + 1; clientConns.push(conn); addPlayer(newId);
        conn.on("open", () => conn.send({ type: "init", id: newId }));
        conn.on("data", (data) => {
          if (data.type === "input" && gameState.players[newId]) {
            gameState.players[newId].keys = data.keys;
            gameState.players[newId].wantsAttack = data.attack;
            gameState.players[newId].aimDir = data.aimDir || { x: 0, y: -1 };
          }
          if (data.type === "upgrade" && gameState.players[newId]) gameState.players[newId].className = data.newClass;
        });
      });
    };

    document.getElementById("join-btn").onclick = () => {
      let hostId = document.getElementById("join-id").value.trim().toUpperCase();
      if (!hostId) return;
      document.getElementById("menu").style.display = "none"; document.getElementById("status").innerText = "Connecting...";
      hostConn = peer.connect(hostId);
      hostConn.on("open", () => document.getElementById("status").innerText = "CONNECTED!");
      hostConn.on("data", (data) => {
        if (data.type === "init") myPlayerId = data.id;
        else if (data.type === "state") { gameState = data.state; updateHUD(); }
      });
    };

    function addPlayer(id) {
      gameState.players[id] = {
        x: Math.random()*(WORLD_SIZE-100)+50, y: Math.random()*(WORLD_SIZE-100)+50,
        hp: 100, score: 0, level: 1, xp: 0, className: "Squire", trapTimer: 350,
        dir: "right", mouseDir: "right", swingTimer: 0, dashTimer: 0, dashCooldown: 0,
        keys: {}, wantsAttack: false, aimDir: { x: 0, y: -1 }
      };
    }

    function getWeaponRectRaw(className, px, py, dir, s, w, l, isAttackingVisual) {
      let offset = isAttackingVisual ? 10 : 0;
      let alignX = px + (s/2) - (w/2); let alignY = py + (s/2) - (w/2);
      let boxes = [];
      if (CLASSES[className].spins && isAttackingVisual) {
        boxes.push({ x: alignX, y: py - l - offset, w: w, h: l });
        boxes.push({ x: alignX, y: py + s + offset, w: w, h: l }); 
        boxes.push({ x: px - l - offset, y: alignY, w: l, h: w });
        boxes.push({ x: px + s + offset, y: alignY, w: l, h: w });
        return boxes;
      }
      if (dir === "up") boxes.push({ x: alignX, y: py - l - offset, w: w, h: l });
      else if (dir === "down") boxes.push({ x: alignX, y: py + s + offset, w: w, h: l });
      else if (dir === "left") boxes.push({ x: px - l - offset, y: alignY, w: l, h: w });
      else if (dir === "right") boxes.push({ x: px + s + offset, y: alignY, w: l, h: w });
      else boxes.push({ x: px + s + offset, y: alignY, w: l, h: w });
      return boxes;
    }

    function getWeaponRect(p, isAttackingVisual = false) {
      let stats = CLASSES[p.className];
      let dir = isAttackingVisual ? p.dir : getCardinalDir(p.aimDir || {x:0,y:-1});
      return getWeaponRectRaw(p.className, p.x, p.y, dir, stats.size, stats.w, stats.l, isAttackingVisual);
    }

    function checkHit(rectA, rectB) { return rectA.x < rectB.x + rectB.w && rectA.x + rectA.w > rectB.x && rectA.y < rectB.y + rectB.h && rectA.y + rectA.h > rectB.y; }

    // XP: each orb gives exactly 25% of required XP for current level, and we reset to 0 after level up
    function addXP(p, amount) {
      p.xp += amount;
      let required = p.level * 1; // XP needed for current level
      while (p.xp >= required) {
        p.level++;
        p.hp = 100;
        p.xp = 0; // reset after level up – ensures exactly 4 orbs per level (each orb = 0.25 * required)
        required = p.level * 1;
      }
    }

    function updatePhysics() {
      if (!isHost) return;
      if (gameState.players[0]) {
        gameState.players[0].keys = keys;
        gameState.players[0].wantsAttack = isAttacking;
        gameState.players[0].aimDir = getAimDir();
      }
      if (Math.random() < 0.05 && gameState.orbs.length < 100) gameState.orbs.push({ x: Math.random()*(WORLD_SIZE-40)+20, y: Math.random()*(WORLD_SIZE-40)+20, size: 10 });
      
      for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        let b = gameState.bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
        if (b.life <= 0) { gameState.bullets.splice(i, 1); continue; }
        let bRect = {x: b.x, y: b.y, w: 10, h: 10};
        Object.keys(gameState.players).forEach(tId => {
          if (b.owner !== tId) {
            let t = gameState.players[tId]; let tSize = CLASSES[t.className].size;
            if (checkHit(bRect, {x: t.x, y: t.y, w: tSize, h: tSize})) {
              t.hp -= 20; b.life = 0;
              if (t.hp <= 0) {
                gameState.players[b.owner].score++;
                addXP(gameState.players[b.owner], 3.0);
                t.hp = 100;
                t.x = Math.random()*(WORLD_SIZE-100)+50;
                t.y = Math.random()*(WORLD_SIZE-100)+50;
              }
            }
          }
        });
      }
      
      for (let i = gameState.traps.length - 1; i >= 0; i--) { gameState.traps[i].life--; if (gameState.traps[i].life <= 0) gameState.traps.splice(i, 1); }

      const pIds = Object.keys(gameState.players);
      pIds.forEach(id => {
        let p = gameState.players[id]; let stats = CLASSES[p.className]; let size = stats.size;
        
        if (stats.trapRate) {
          p.trapTimer--;
          if (p.trapTimer <= 0) {
            gameState.traps.push({ x: p.x + size/2 - 15, y: p.y + size/2 - 15, owner: id, life: 600 });
            p.trapTimer = stats.trapRate;
          }
        }
        if (p.dashCooldown > 0) p.dashCooldown--;
        if (p.swingTimer > 0) p.swingTimer--;

        let spd = stats.speed;
        if (p.keys["Space"] && p.dashCooldown === 0) { p.dashTimer = 10; p.dashCooldown = stats.cooldown; }
        if (p.dashTimer > 0) { spd = stats.dash; p.dashTimer--; }

        if (p.keys["KeyW"] || p.keys["ArrowUp"]) p.y -= spd;
        if (p.keys["KeyS"] || p.keys["ArrowDown"]) p.y += spd;
        if (p.keys["KeyA"] || p.keys["ArrowLeft"]) p.x -= spd;
        if (p.keys["KeyD"] || p.keys["ArrowRight"]) p.x += spd;
        p.x = Math.max(0, Math.min(WORLD_SIZE-size, p.x));
        p.y = Math.max(0, Math.min(WORLD_SIZE-size, p.y));

        gameState.traps.forEach(trap => {
          if (trap.owner !== id && checkHit({x: p.x, y: p.y, w: size, h: size}, {x: trap.x, y: trap.y, w: 30, h: 30})) {
            p.hp -= 2.0;
            if (p.hp <= 0) {
              p.hp = 100;
              p.x = Math.random()*(WORLD_SIZE-100)+50;
              p.y = Math.random()*(WORLD_SIZE-100)+50;
              if (gameState.players[trap.owner]) {
                gameState.players[trap.owner].score++;
                addXP(gameState.players[trap.owner], 3.0);
              }
            }
          }
        });

        if (p.wantsAttack && p.swingTimer === 0 && p.dashTimer <= 0) {
          let aim = p.aimDir || {x:0,y:-1};
          p.dir = getCardinalDir(aim);
          p.swingTimer = stats.swingTicks;
          
          if (stats.shoots) {
            let bSpeed = (p.className === "Sniper" || p.className === "RapidPierce") ? 22 : 13;
            let vx = aim.x * bSpeed;
            let vy = aim.y * bSpeed;
            if (Math.hypot(vx, vy) < 0.1) { vx = 0; vy = -bSpeed; }
            gameState.bullets.push({
              x: p.x + size/2 - 5,
              y: p.y + size/2 - 5,
              vx: vx,
              vy: vy,
              life: 100,
              owner: id
            });
          }

          let hitboxes = getWeaponRect(p, true);
          hitboxes.forEach(box => {
            for (let i = gameState.orbs.length - 1; i >= 0; i--) {
              let o = gameState.orbs[i];
              if (checkHit(box, {x: o.x-o.size, y: o.y-o.size, w: o.size*2, h: o.size*2})) {
                // Each orb gives exactly 25% of required XP for current level
                addXP(p, p.level * 0.25);
                gameState.orbs.splice(i, 1);
              }
            }
            pIds.forEach(tId => {
              if (id !== tId) {
                let t = gameState.players[tId]; let tSize = CLASSES[t.className].size;
                if (checkHit(box, {x: t.x, y: t.y, w: tSize, h: tSize})) {
                  t.hp -= 25;
                  if (t.hp <= 0) {
                    p.score++;
                    addXP(p, 3.0);
                    t.hp = 100;
                    t.x = Math.random()*(WORLD_SIZE-100)+50;
                    t.y = Math.random()*(WORLD_SIZE-100)+50;
                  }
                }
              }
            });
          });
        }
      });

      let now = Date.now();
      if (now - lastNetTime > 16) {
        clientConns.forEach(c => { if (c.open) c.send({ type: "state", state: gameState }); });
        lastNetTime = now;
      }
      
      let txt = "";
      Object.keys(gameState.players).forEach(i => {
        txt += `<span style="color:${CLASSES[gameState.players[i].className].color}">Player ${parseInt(i)+1}: Lvl ${gameState.players[i].level}</span> | `;
      });
      document.getElementById("scores").innerHTML = txt.slice(0, -2);
    }

    // ---- RENDER STATIC TANK (for class tree) with improved text ----
    function renderStaticTank(ctx, className, x, y, scale = 0.6) {
      let stats = CLASSES[className];
      let s = stats.size * scale;
      let w = stats.w * scale;
      let l = stats.l * scale;

      let hitboxes = getWeaponRectRaw(className, x - s/2, y - s/2, "right", s, w, l, false);
      ctx.fillStyle = "#888";
      hitboxes.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
      ctx.fillStyle = stats.color;
      ctx.fillRect(x - s/2, y - s/2, s, s);
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1.2;
      ctx.strokeRect(x - s/2, y - s/2, s, s);
      
      // Label with background for readability
      ctx.textAlign = "center";
      ctx.font = "9px sans-serif";
      let txt = className;
      let metrics = ctx.measureText(txt);
      let tw = metrics.width + 8;
      let th = 14;
      let tx = x - tw/2;
      let ty = y + s/2 + 4;
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(tx, ty, tw, th);
      ctx.fillStyle = "#fff";
      ctx.fillText(txt, x, ty + 10);
    }

    function drawClassTree() {
      document.getElementById("menu-container").style.opacity = showTree ? "0" : "1";
      document.getElementById("hud").style.opacity = showTree ? "0" : "1";
      document.getElementById("upgrade-menu").style.opacity = showTree ? "0" : "1";

      ctx.fillStyle = "rgba(10, 10, 15, 0.98)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "#00ffcc";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("CLASS EVOLUTION TREE", canvas.width / 2, 35);

      const t5Count = 16;
      const startY = 60;
      const endY = canvas.height - 40;
      const stepY = (endY - startY) / (t5Count - 1);

      const col1X = canvas.width * 0.07;
      const col2X = canvas.width * 0.24;
      const col3X = canvas.width * 0.41;
      const col4X = canvas.width * 0.58;
      const col5X = canvas.width * 0.80;

      let tier5Pos = {};
      let leafIndex = 0;
      const finals = [
        "TitanWall", "Crusher",
        "ParryKnight", "MirrorMaze",
        "Gale", "TwinStorm",
        "LanceKing", "RapidPierce",
        "GiantSlayer", "ReaperLord",
        "MeteorWhip", "ChainStorm",
        "Landlord", "Spikewall",
        "Paladin", "Warzone"
      ];
      finals.forEach(name => {
        tier5Pos[name] = { x: col5X, y: startY + leafIndex * stepY };
        leafIndex++;
      });

      let tier4Pos = {};
      const tier4Classes = [
        "Behemoth", "Fortress",
        "Mirror", "Deflector",
        "Typhoon", "Cyclone",
        "Lancer", "Pikeman",
        "Guillotine", "Reaper",
        "WreckingBall", "Meteor",
        "Trapper", "Spike",
        "Artillery", "Sniper"
      ];
      tier4Classes.forEach(t4 => {
        let opts = UPGRADE_PATHS[45][t4];
        if (opts && opts.length === 2) {
          tier4Pos[t4] = { x: col4X, y: (tier5Pos[opts[0]].y + tier5Pos[opts[1]].y) / 2 };
        }
      });

      let tier3Pos = {};
      const tier3Classes = ["Juggernaut", "Reflector", "Hurricane", "Spearman", "Executioner", "Flailer", "Minefield", "Gunblade"];
      tier3Classes.forEach(t3 => {
        let children = UPGRADE_PATHS[30][t3];
        if (children && children.length === 2) {
          tier3Pos[t3] = { x: col3X, y: (tier4Pos[children[0]].y + tier4Pos[children[1]].y) / 2 };
        }
      });

      let tier2Pos = {};
      const tier2Classes = ["Guardian", "Duelist", "Berserker", "Warden"];
      tier2Classes.forEach(t2 => {
        let children = UPGRADE_PATHS[15][t2];
        if (children && children.length === 2) {
          tier2Pos[t2] = { x: col2X, y: (tier3Pos[children[0]].y + tier3Pos[children[1]].y) / 2 };
        }
      });

      let t1Pos = { x: col1X, y: (tier2Pos["Guardian"].y + tier2Pos["Warden"].y) / 2 };

      // Draw lines
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.lineWidth = 1.5;
      Object.keys(tier2Pos).forEach(k => {
        ctx.beginPath();
        ctx.moveTo(t1Pos.x + 12, t1Pos.y);
        ctx.lineTo(tier2Pos[k].x - 12, tier2Pos[k].y);
        ctx.stroke();
      });
      Object.keys(UPGRADE_PATHS[15]).forEach(t2 => {
        UPGRADE_PATHS[15][t2].forEach(t3 => {
          ctx.beginPath();
          ctx.moveTo(tier2Pos[t2].x + 12, tier2Pos[t2].y);
          ctx.lineTo(tier3Pos[t3].x - 12, tier3Pos[t3].y);
          ctx.stroke();
        });
      });
      Object.keys(UPGRADE_PATHS[30]).forEach(t3 => {
        UPGRADE_PATHS[30][t3].forEach(t4 => {
          ctx.beginPath();
          ctx.moveTo(tier3Pos[t3].x + 12, tier3Pos[t3].y);
          ctx.lineTo(tier4Pos[t4].x - 12, tier4Pos[t4].y);
          ctx.stroke();
        });
      });
      Object.keys(UPGRADE_PATHS[45]).forEach(t4 => {
        if (tier4Pos[t4]) {
          UPGRADE_PATHS[45][t4].forEach(t5 => {
            ctx.beginPath();
            ctx.moveTo(tier4Pos[t4].x + 12, tier4Pos[t4].y);
            ctx.lineTo(tier5Pos[t5].x - 12, tier5Pos[t5].y);
            ctx.stroke();
          });
        }
      });

      // Render
      renderStaticTank(ctx, "Squire", t1Pos.x, t1Pos.y);
      Object.keys(tier2Pos).forEach(k => renderStaticTank(ctx, k, tier2Pos[k].x, tier2Pos[k].y));
      Object.keys(tier3Pos).forEach(k => renderStaticTank(ctx, k, tier3Pos[k].x, tier3Pos[k].y));
      Object.keys(tier4Pos).forEach(k => renderStaticTank(ctx, k, tier4Pos[k].x, tier4Pos[k].y));
      Object.keys(tier5Pos).forEach(k => renderStaticTank(ctx, k, tier5Pos[k].x, tier5Pos[k].y));
    }

    function updateLeaderboard() {
      let lbDiv = document.getElementById("leaderboard");
      let entriesDiv = document.getElementById("lb-entries");
      let players = gameState.players;
      let pIds = Object.keys(players);
      if (pIds.length === 0) { lbDiv.style.display = "none"; return; }
      lbDiv.style.display = "block";
      let sorted = pIds.map(id => ({ id, player: players[id] }));
      sorted.sort((a, b) => b.player.score - a.player.score);
      entriesDiv.innerHTML = sorted.map(entry => {
        let name = `P${parseInt(entry.id)+1}`;
        let color = CLASSES[entry.player.className].color;
        return `<div class="entry"><span class="name" style="color:${color}">${name}</span><span class="score">${entry.player.score}</span></div>`;
      }).join("");
    }

    function drawMiniMap() {
      const mapSize = 140;
      const margin = 15;
      const x = canvas.width - mapSize - margin;
      const y = margin;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(x-2, y-2, mapSize+4, mapSize+4);
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 1;
      ctx.strokeRect(x-2, y-2, mapSize+4, mapSize+4);
      ctx.globalAlpha = 1.0;
      
      const scale = mapSize / WORLD_SIZE;
      Object.keys(gameState.players).forEach(id => {
        let p = gameState.players[id];
        let px = x + p.x * scale;
        let py = y + p.y * scale;
        let size = Math.max(3, CLASSES[p.className].size * scale * 0.5);
        ctx.fillStyle = CLASSES[p.className].color;
        ctx.fillRect(px - size/2, py - size/2, size, size);
      });
      gameState.orbs.forEach(o => {
        ctx.fillStyle = "#ffcc00";
        ctx.beginPath();
        ctx.arc(x + o.x * scale, y + o.y * scale, 2, 0, Math.PI*2);
        ctx.fill();
      });
      gameState.traps.forEach(t => {
        ctx.fillStyle = "#ff5555";
        ctx.fillRect(x + t.x * scale, y + t.y * scale, 3, 3);
      });
      gameState.bullets.forEach(b => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + b.x * scale, y + b.y * scale, 2, 2);
      });
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let myP = gameState.players[myPlayerId];
      if (!myP) return; let mySize = CLASSES[myP.className].size;

      ctx.save();
      ctx.translate(-(myP.x - canvas.width/2 + mySize/2), -(myP.y - canvas.height/2 + mySize/2));

      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1;
      for(let i=0; i<WORLD_SIZE; i+=100){
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(WORLD_SIZE,i); ctx.stroke();
      }
      ctx.strokeStyle = "#555";
      ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

      gameState.orbs.forEach(o => { ctx.fillStyle = "#ffcc00"; ctx.beginPath(); ctx.arc(o.x, o.y, o.size, 0, Math.PI*2); ctx.fill(); });
      gameState.traps.forEach(t => { ctx.fillStyle = "#ff5555"; ctx.fillRect(t.x, t.y, 30, 30); ctx.fillStyle = "#222"; ctx.fillRect(t.x+6, t.y+6, 18, 18); });
      gameState.bullets.forEach(b => { ctx.fillStyle = "#fff"; ctx.fillRect(b.x, b.y, 10, 10); });

      Object.values(gameState.players).forEach(p => {
        let stats = CLASSES[p.className]; let size = stats.size;
        let isSwinging = p.swingTimer > 3;
        let hitboxes = getWeaponRect(p, isSwinging);
        // Weapon with outline
        ctx.fillStyle = isSwinging ? "#ffffff" : "#999999";
        hitboxes.forEach(b => {
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        });

        // Player body with gradient & glow
        let grad = ctx.createRadialGradient(p.x+size/2, p.y+size/2, 2, p.x+size/2, p.y+size/2, size/2);
        grad.addColorStop(0, stats.color);
        grad.addColorStop(1, "#000");
        ctx.fillStyle = grad;
        ctx.shadowColor = stats.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(p.x, p.y, size, size);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(p.x, p.y, size, size);

        ctx.fillStyle = "#f00";
        ctx.fillRect(p.x, p.y-12, size, 4);
        ctx.fillStyle = "#0f0";
        ctx.fillRect(p.x, p.y-12, size*(p.hp/100), 4);
        ctx.fillStyle = "#0ff";
        ctx.fillRect(p.x, p.y+size+4, size*(1-(p.dashCooldown/stats.cooldown)), 3);
      });
      ctx.restore();

      drawMiniMap();

      if (showTree) drawClassTree();
      else {
        document.getElementById("menu-container").style.opacity = "1";
        document.getElementById("hud").style.opacity = "1";
        document.getElementById("upgrade-menu").style.opacity = "1";
      }

      if (isHost) updateHUD();
    }

    function loop() {
      if (isHost) updatePhysics();
      else if (hostConn && hostConn.open) {
        let now = Date.now();
        if (now - lastClientTime > 16) {
          let aim = getAimDir();
          hostConn.send({
            type: "input",
            keys: {...keys},
            attack: isAttacking,
            aimDir: aim
          });
          lastClientTime = now;
        }
      }
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
